<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>东方财富(300059) 红榜 2026-08-05</title>
<style>
:root{--red:#d8342c;--redbg:#fdecea;--green:#1a9e54;--ink:#1c2230;--muted:#6b7385;
--line:#e7e9ef;--card:#fff;--bg:#f4f6fa;--chip:#eef1f6;--dark:#23262d;--darkbg:#ececef}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
"Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);
line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
header.top{background:linear-gradient(135deg,#1c2230,#2c3550);color:#fff;border-radius:14px;
padding:22px 24px;margin-bottom:20px;box-shadow:0 6px 24px rgba(20,26,46,.12)}
header.top h1{margin:0 0 6px;font-size:24px;letter-spacing:.5px}
header.top .sub{opacity:.85;font-size:13px}
header.top .sub b{color:#ffd166;font-weight:600}
nav.mkt{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;
background:rgba(244,246,250,.92);backdrop-filter:blur(6px);padding:10px 0;margin-bottom:14px}
nav.mkt a{text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
nav.mkt a:hover{border-color:var(--red);color:var(--red)}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.summary .chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:8px 12px;font-size:12px;color:var(--muted)}
.summary .chip b{color:var(--ink);font-size:14px;margin-left:4px}
section.board{margin:26px 0}
.board-title{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:19px}
.board-title .dot{width:10px;height:10px;border-radius:50%}
.board-title.red .dot{background:var(--red)}
.board-title.black .dot{background:var(--dark)}
.board-title small{color:var(--muted);font-weight:400;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
position:relative;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 18px rgba(20,26,46,.08)}
.card.red{border-top:3px solid var(--red)}
.card.black{border-top:3px solid var(--dark)}
.rank{position:absolute;top:10px;right:12px;font-size:26px;font-weight:800;color:#eceff5}
.card.red .rank{color:#fbdcD9}
.nm{font-size:16px;font-weight:700}
.nm .tk{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.tag{display:inline-block;background:var(--chip);color:var(--muted);border-radius:6px;
padding:1px 7px;font-size:11px;margin:6px 6px 0 0}
.price-row{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px}
.price{font-size:24px;font-weight:800}
.pct{font-size:14px;font-weight:700;padding:2px 8px;border-radius:8px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}
.pct.up{background:var(--redbg)}.pct.down{background:#e2f4e9}.pct.flat{background:var(--chip)}
.psrc{font-size:11px;color:var(--muted);margin-left:auto}
.scores{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.scores span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted)}
.scores span b{color:var(--ink)}
.pts{font-size:12.5px;margin:8px 0 0}
.pts .h{font-weight:700;font-size:12px;margin:6px 0 2px}
.pts .h.bull{color:var(--red)}.pts .h.bear{color:var(--green)}
.pts ul{margin:2px 0 4px;padding-left:18px;color:#3a4152}
.pts li{margin:1px 0}
.masters{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.masters b{color:var(--ink)}
.summ{font-size:12.5px;color:#3a4152;background:#fafbfd;border:1px solid var(--line);
border-radius:8px;padding:8px 10px;margin-top:8px}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);
border-radius:10px;padding:18px;text-align:center}
footer{margin-top:34px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}
a.lnk{color:var(--red);text-decoration:none}
/* ── detail page ── */
.backbar{margin-bottom:14px;font-size:13px}
.backbar a{color:var(--muted);text-decoration:none;margin-right:14px}
.backbar a:hover{color:var(--red)}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:700;margin-right:8px}
.badge.red{background:var(--red);color:#fff}.badge.black{background:var(--dark);color:#fff}
.trade{display:flex;flex-wrap:wrap;gap:10px;background:linear-gradient(135deg,#2c3550,#1c2230);
color:#fff;border-radius:12px;padding:16px 18px;margin:16px 0}
.trade .cell{min-width:120px}
.trade .k{font-size:11px;opacity:.75}
.trade .v{font-size:18px;font-weight:800;margin-top:2px}
.trade .v.buy{color:#7ee2a8}.trade .v.sell{color:#ff9d97}.trade .v.hold{color:#ffd166}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.mgrid .m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mgrid .m .k{font-size:11px;color:var(--muted)}
.mgrid .m .v{font-size:16px;font-weight:700;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.panel>h2{margin:0 0 12px;font-size:17px}
.panel>h2 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.mreply{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;
padding:12px 14px;margin:10px 0;background:#fff}
.mreply .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mreply .mh .who{font-weight:700;font-size:14px}
.mreply .mh .mscore{margin-left:auto;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.md h2,.md h3,.md h4,.md h5{margin:12px 0 6px;font-size:15px}
.md p{margin:6px 0;font-size:13.5px;color:#2c3345}
.md ul{margin:6px 0;padding-left:20px;font-size:13.5px;color:#2c3345}
.md li{margin:3px 0}
.md strong{color:var(--ink)}
details{border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;padding:0}
details>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";color:var(--red)}
details[open]>summary:before{content:"▾ "}
details>.body{padding:0 16px 14px;border-top:1px dashed var(--line)}
.ychip{display:inline-block;background:var(--chip);border-radius:8px;padding:4px 10px;font-size:12px;margin:3px 6px 3px 0}
.ychip b{font-size:13px}
.news .nitem{border-top:1px dashed var(--line);padding:8px 0;font-size:13px}
.news .nitem .t{font-weight:600}
.news .nitem .s{color:var(--muted);font-size:12px}
/* ── root landing page ── */
.hero{padding:30px 26px}
.hero-kicker{color:#ffd166;font-size:12px;font-weight:700;letter-spacing:2px;
text-transform:uppercase;margin-bottom:8px}
.hero h1{font-size:30px;margin:0 0 10px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.day-card{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);
border-radius:12px;padding:14px 16px;transition:all .15s}
.day-card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(216,52,44,.12);transform:translateY(-2px)}
.day-card .d{font-weight:800;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.day-card .m{margin-top:8px;display:flex;gap:6px}
.day-card .m span{background:var(--chip);color:var(--muted);border-radius:6px;
padding:2px 8px;font-size:11px}
.latest-badge{background:var(--red);color:#fff;border-radius:6px;padding:1px 7px;
font-size:10px;font-weight:700}
</style>
</head>
